<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Liquid Glass</title>
    <link rel="stylesheet" type="text/css" href="style.css" media="screen" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="card">
      <div id="art"></div>

      <div id="meta">
        <div id="clock">00:00</div>

        <div id="media-content">
          <div id="separator"></div>

          <div id="title">Nothing playing</div>
          <div id="artist">Play a song to see it here</div>
          <div id="album"></div>

          <div id="bar">
            <div id="fill"></div>
          </div>

          <div id="times">
            <span id="tpos">0:00</span>
            <span id="tdur">0:00</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      async function initialize() {
        // ---- Settings (adjustable live via Wallpaper Engine properties) ----
        const settings = {
          speed: 0.2,
          scale: 1,
          bands: 0.5,
          fold: 1.0,
          gap: 0.7,
          fog: 0.5,
          quality: 16,
          showmedia: true,
          cardsize: 1.0,
          colorshift: true,
          colorspeed: 0.05,
          glow: 1.0,
          purple: 1.0,
          dark: 1.0,
          clocksize: 6.0,
          textsize: 1.0,
        };

        const canvas = document.getElementById("c");
        const gl = canvas.getContext("webgl", {
          antialias: false,
          alpha: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: false,
        });

        async function loadShader(url) {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(
              `Failed to load shader "${url}": ${response.status}`,
            );
          }

          return response.text();
        }

        // The vertex shader positions the canvas quad; the fragment shader
        // calculates the color of each pixel to draw the animated ribbons.
        const [vertexShaderSource, fragmentShaderSource] = await Promise.all([
          loadShader("openGL/vertex.glsl"),
          loadShader("openGL/fragment.glsl"),
        ]);

        let collapseTimer = null;
        let clearMediaTimer = null;

        function createShader(shaderType, shaderSource) {
          const shader = gl.createShader(shaderType);
          gl.shaderSource(shader, shaderSource);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            console.error(gl.getShaderInfoLog(shader));

          return shader;
        }

        const shaderProgram = gl.createProgram();

        gl.attachShader(
          shaderProgram,
          createShader(gl.VERTEX_SHADER, vertexShaderSource),
        );
        gl.attachShader(
          shaderProgram,
          createShader(gl.FRAGMENT_SHADER, fragmentShaderSource),
        );
        gl.linkProgram(shaderProgram);
        gl.useProgram(shaderProgram);

        const quadBuffer = gl.createBuffer();

        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);

        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );

        const positionAttributeLocation = gl.getAttribLocation(
          shaderProgram,
          "position",
        );

        gl.enableVertexAttribArray(positionAttributeLocation);
        gl.vertexAttribPointer(
          positionAttributeLocation,
          2,
          gl.FLOAT,
          false,
          0,
          0,
        );

        const getUniformLocation = (uniformName) =>
          gl.getUniformLocation(shaderProgram, uniformName);

        const resolutionLocation = getUniformLocation("resolution");
        const elapsedTimeLocation = getUniformLocation("elapsedTime");
        const waveScaleLocation = getUniformLocation("waveScale");
        const bandDensityLocation = getUniformLocation("bandDensity");
        const foldAmountLocation = getUniformLocation("foldAmount");
        const waveGapLocation = getUniformLocation("waveGap");
        const fogAmountLocation = getUniformLocation("fogAmount");
        const qualityStepsLocation = getUniformLocation("qualitySteps");
        const colorShiftEnabledLocation = getUniformLocation("colorShiftEnabled");
        const colorShiftTimeLocation = getUniformLocation("colorShiftTime");
        const glossinessLocation = getUniformLocation("glossiness");
        const purpleAmountLocation = getUniformLocation("purpleAmount");
        const creaseDepthLocation = getUniformLocation("creaseDepth");

        // Reduce this value to trade resolution for rendering performance.
        const renderScale = 1;

        function resize() {
          canvas.width = Math.floor(innerWidth * renderScale);
          canvas.height = Math.floor(innerHeight * renderScale);
          gl.viewport(0, 0, canvas.width, canvas.height);
        }

        addEventListener("resize", () => {
          resize();
          layout();
        });

        resize();

        // ---- Now-playing card and digital clock ----
        const getElement = (elementId) => document.getElementById(elementId);

        const card = getElement("card");
        const albumArt = getElement("art");
        const clock = getElement("clock");
        const titleElement = getElement("title");
        const artistElement = getElement("artist");
        const albumElement = getElement("album");
        const progressFill = getElement("fill");
        const positionElement = getElement("tpos");
        const durationElement = getElement("tdur");

        // Local 24-hour digital clock
        function updateClock() {
          const now = new Date();

          clock.textContent =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0");
        }

        updateClock();
        setInterval(updateClock, 1000);

        // ---- Wallpaper Engine media integration ----
        const mediaState = {
          enabled: true,
          title: "",
          artist: "",
          album: "",
          playing: false,
          position: 0,
          duration: 0,
          displayedSecond: -1,
        };

        function layout() {
          const cardScale = settings.cardsize;

          document.documentElement.style.setProperty("--k", cardScale);
          document.documentElement.style.setProperty(
            "--clock-size",
            settings.clocksize,
          );
          document.documentElement.style.setProperty(
            "--text-size",
            settings.textsize,
          );
          card.style.display = settings.showmedia ? "flex" : "none";
        }

        const formatTime = (seconds) => {
          seconds = Math.max(0, Math.floor(seconds || 0));

          return (
            Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0")
          );
        };

        const cssColor = (c) =>
          !c ? null : /^\d/.test(c) ? "rgb(" + c + ")" : c;

        function animateSwapIn(element) {
          element.classList.remove("swap");
          void element.offsetWidth;
          element.classList.add("swap");
        }

        let clockPositionFrame = 0;

        function setClockLayout(clockOnly) {
          const wasClockOnly = card.classList.contains("clock-only");

          if (wasClockOnly === clockOnly) return;

          const previousRect = clock.getBoundingClientRect();
          if (clockPositionFrame) {
            cancelAnimationFrame(clockPositionFrame);
          }

          clock.style.transition =
            "font-size 2s cubic-bezier(0.65, 0, 0.35, 1), translate 0s";
          clock.style.translate = "";
          card.classList.toggle("clock-only", clockOnly);
          const nextRect = clock.getBoundingClientRect();
          const offsetX = previousRect.left - nextRect.left;
          const offsetY = previousRect.top - nextRect.top;
          const centeredOffset = clockOnly ? "-50%" : "0%";

          clock.style.translate =
            `calc(${centeredOffset} + ${offsetX}px) ` +
            `calc(${centeredOffset} + ${offsetY}px)`;
          void clock.offsetWidth;

          clockPositionFrame = requestAnimationFrame(() => {
            clock.style.transition = "";
            clock.style.translate = "";
            clockPositionFrame = 0;
          });
        }

        function renderMediaMetadata() {
          const hasTrack = !!mediaState.title.trim() && mediaState.playing;

          clearTimeout(clearMediaTimer);

          if (!hasTrack) {
            // Retain the outgoing metadata until the 2-second collapse finishes.
            clearMediaTimer = setTimeout(() => {
              // Don't clear a new track that started during the collapse.
              if (!mediaState.title.trim() || !mediaState.playing) {
                titleElement.textContent = "";
                artistElement.textContent = "";
                albumElement.textContent = "";
                progressFill.style.transform = "scaleX(0)";
                positionElement.textContent = "0:00";
                durationElement.textContent = "0:00";
              }
            }, 2000);
          }

          let title = mediaState.title;
          let artist = mediaState.artist;
          let album = mediaState.album;

          if (!mediaState.enabled) {
            title = "Media integration is off";
            artist = "Enable it in Wallpaper Engine settings";
            album = "";
          } else if (!hasTrack) {
            // Preserve existing text while the card shrinks.
            title = titleElement.textContent;
            artist = artistElement.textContent;
            album = albumElement.textContent;
          }

          if (titleElement.textContent !== title) {
            titleElement.textContent = title;
            if (title) animateSwapIn(titleElement);
          }

          if (artistElement.textContent !== artist) {
            artistElement.textContent = artist;
            if (artist) animateSwapIn(artistElement);
          }

          albumElement.textContent = album;
          setClockLayout(!hasTrack);
          card.classList.toggle("paused", !mediaState.playing && hasTrack);
        }

        function renderPlaybackTime() {
          const progress =
            mediaState.duration > 0
              ? Math.max(
                  0,
                  Math.min(mediaState.position / mediaState.duration, 1),
                )
              : 0;

          progressFill.style.transform = `scaleX(${progress})`;

          const elapsedSeconds = Math.floor(mediaState.position);

          if (elapsedSeconds !== mediaState.displayedSecond) {
            mediaState.displayedSecond = elapsedSeconds;
            positionElement.textContent = formatTime(mediaState.position);
            durationElement.textContent = formatTime(mediaState.duration);
          }
        }

        function advanceMediaPlayback(deltaSeconds) {
          // Predict progress locally; timeline events periodically correct drift.
          if (mediaState.playing && mediaState.duration > 0) {
            mediaState.position = Math.min(
              mediaState.position + deltaSeconds,
              mediaState.duration,
            );
          }

          renderPlaybackTime();
        }

        if (window.wallpaperRegisterMediaStatusListener) {
          window.wallpaperRegisterMediaStatusListener((event) => {
            mediaState.enabled = !!event.enabled;
            renderMediaMetadata();
          });
        }

        if (window.wallpaperRegisterMediaPropertiesListener) {
          window.wallpaperRegisterMediaPropertiesListener((event) => {
            mediaState.title = event.title || "";
            mediaState.artist = event.artist || "";
            mediaState.album = event.albumTitle || "";

            renderMediaMetadata();
          });
        }

        if (window.wallpaperRegisterMediaThumbnailListener) {
          window.wallpaperRegisterMediaThumbnailListener((event) => {
            albumArt.style.backgroundImage = event.thumbnail
              ? 'url("' + event.thumbnail + '")'
              : "";

            const accentColor = cssColor(event.primaryColor);

            if (accentColor) card.style.setProperty("--acc", accentColor);
          });
        }

        if (window.wallpaperRegisterMediaPlaybackListener) {
          window.wallpaperRegisterMediaPlaybackListener((event) => {
            const playbackStates =
              window.wallpaperMediaIntegration &&
              window.wallpaperMediaIntegration.playback;

            mediaState.playing =
              event.state === (playbackStates ? playbackStates.PLAYING : 1);

            renderMediaMetadata();
          });
        }

        if (window.wallpaperRegisterMediaTimelineListener) {
          window.wallpaperRegisterMediaTimelineListener((event) => {
            const timelinePosition = Math.max(0, event.position || 0);
            const trackDuration = Math.max(0, event.duration || 0);

            mediaState.duration = trackDuration;

            // Ignore small corrections to prevent visible progress-bar jumps.
            if (
              !mediaState.playing ||
              Math.abs(timelinePosition - mediaState.position) > 1.5
            ) {
              mediaState.position = timelinePosition;
            }

            renderPlaybackTime();
          });
        }

        layout();
        renderMediaMetadata();

        // ---- Animation loop ----
        let animationTime = 0;
        let colorShiftElapsedTime = 0;
        let previousFrameTimestamp = performance.now();
        let animationFrameRequestId = 0;
        let renderingActive = false;
        let pageHiddenAt = 0;
        const MAX_RENDER_FPS = 60;
        const MIN_FRAME_INTERVAL = MAX_RENDER_FPS > 0 ? 1000 / MAX_RENDER_FPS : 0;
        let lastRenderedAt = 0;

        function stopAnimation() {
          renderingActive = false;

          if (animationFrameRequestId) {
            cancelAnimationFrame(animationFrameRequestId);
            animationFrameRequestId = 0;
          }
        }

        function startAnimation() {
          if (renderingActive || document.hidden || gl.isContextLost()) return;

          renderingActive = true;
          previousFrameTimestamp = performance.now();
          lastRenderedAt = 0;
          animationFrameRequestId = requestAnimationFrame(renderFrame);
        }

        function renderFrame(timestamp) {
          animationFrameRequestId = 0;

          if (!renderingActive || document.hidden || gl.isContextLost()) {
            stopAnimation();
            return;
          }

          // Limit GPU rendering frequency.
          if (MIN_FRAME_INTERVAL > 0 && lastRenderedAt > 0) {
            const timeSinceLastRender = timestamp - lastRenderedAt;

            if (timeSinceLastRender < MIN_FRAME_INTERVAL) {
              animationFrameRequestId = requestAnimationFrame(renderFrame);
              return;
            }
          }

          const deltaSeconds = Math.min(
            Math.max((timestamp - previousFrameTimestamp) / 1000, 0),
            0.1,
          );
          previousFrameTimestamp = timestamp;
          lastRenderedAt = timestamp;

          animationTime += deltaSeconds * settings.speed;
          colorShiftElapsedTime += deltaSeconds * settings.colorspeed;

          advanceMediaPlayback(deltaSeconds);

          if (canvas.width > 0 && canvas.height > 0) {
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(elapsedTimeLocation, animationTime);
            gl.uniform1f(waveScaleLocation, settings.scale);
            gl.uniform1f(bandDensityLocation, 3.2 * settings.bands);
            gl.uniform1f(foldAmountLocation, settings.fold);
            gl.uniform1f(waveGapLocation, settings.gap);
            gl.uniform1f(fogAmountLocation, settings.fog);
            gl.uniform1f(qualityStepsLocation, settings.quality);
            gl.uniform1f(colorShiftEnabledLocation, settings.colorshift ? 1 : 0);
            gl.uniform1f(colorShiftTimeLocation, colorShiftElapsedTime * 6.2832);
            gl.uniform1f(glossinessLocation, settings.glow);
            gl.uniform1f(purpleAmountLocation, settings.purple);
            gl.uniform1f(creaseDepthLocation, settings.dark);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          if (renderingActive) {
            animationFrameRequestId = requestAnimationFrame(renderFrame);
          }
        }

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            pageHiddenAt = performance.now();
            stopAnimation();
            return;
          }

          // Account for time spent hidden so the displayed position stays current.
          if (pageHiddenAt && mediaState.playing && mediaState.duration > 0) {
            const hiddenDurationSeconds =
              (performance.now() - pageHiddenAt) / 1000;
            mediaState.position = Math.min(
              mediaState.position + hiddenDurationSeconds,
              mediaState.duration,
            );
            renderPlaybackTime();
          }

          pageHiddenAt = 0;
          startAnimation();
        });

        window.addEventListener("pagehide", stopAnimation);
        window.addEventListener("pageshow", startAnimation);

        startAnimation();

        // ---- Wallpaper Engine live properties ----
        window.wallpaperPropertyListener = {
          applyUserProperties(properties) {
            for (const propertyName of Object.keys(settings)) {
              if (properties[propertyName]) {
                settings[propertyName] = properties[propertyName].value;
              }
            }

            layout();
          },
        };
      }

      initialize().catch((error) => {
        console.error("Wallpaper initialization failed:", error);
      });
    </script>
  </body>
</html>
